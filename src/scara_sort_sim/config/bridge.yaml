# Topics copied between Gazebo and ROS 2 by ros_gz_bridge.

- ros_topic_name: "clock"            # simulation time
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "joint_states"     # where the joints are now
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Joint targets: ROS -> Gazebo motors (radians for j1/j2, metres down for j3)
- ros_topic_name: "scara/j1_cmd"
  gz_topic_name: "scara/j1_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "scara/j2_cmd"
  gz_topic_name: "scara/j2_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "scara/j3_cmd"
  gz_topic_name: "scara/j3_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Conveyor belt: speed command (m/s, 0 stops it) and the belt's encoder
- ros_topic_name: "conveyor/cmd_vel"
  gz_topic_name: "conveyor/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "conveyor/odom"    # pose.pose.position.x = metres of belt travelled
  gz_topic_name: "conveyor/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Gazebo's services to add and remove models, callable from ROS 2
- service_name: "/world/sort_cell/create"
  ros_type_name: "ros_gz_interfaces/srv/SpawnEntity"
  gz_req_type_name: "gz.msgs.EntityFactory"
  gz_rep_type_name: "gz.msgs.Boolean"

- service_name: "/world/sort_cell/remove"
  ros_type_name: "ros_gz_interfaces/srv/DeleteEntity"
  gz_req_type_name: "gz.msgs.Entity"
  gz_rep_type_name: "gz.msgs.Boolean"

